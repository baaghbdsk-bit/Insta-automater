name: reel-checker

# Lightweight hourly safety net. Instead of running the full engine 24 times a
# day, this checks whether the last publish run succeeded and only triggers a
# retry when it did not. The engine's own guards (daily cap, min gap, dedupe,
# reconcile) make the triggered run safe.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check last publish run and retry if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          node << 'NODE'
          const { execSync } = require('node:child_process');

          const repo = process.env.REPO;
          const token = process.env.GH_TOKEN;

          async function api(path) {
            const res = await fetch(`https://api.github.com${path}`, {
              headers: {
                Authorization: `Bearer ${token}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
              },
            });
            if (!res.ok) throw new Error(`API ${res.status}: ${await res.text()}`);
            return res.json();
          }

          (async () => {
            // Get the last 5 runs of publish.yml
            const data = await api(`/repos/${repo}/actions/workflows/publish.yml/runs?per_page=5`);
            const runs = data.workflow_runs || [];

            const now = Date.now();
            const twoHoursAgo = now - 2 * 60 * 60 * 1000;

            // Check if there's a run currently in progress
            const inProgress = runs.find(r => r.status === 'in_progress' || r.status === 'queued');
            if (inProgress) {
              console.log(`A run is already ${inProgress.status} (#${inProgress.id}). Skipping.`);
              return;
            }

            // Check if the most recent completed run succeeded recently
            const recentSuccess = runs.find(r =>
              r.conclusion === 'success' &&
              new Date(r.updated_at).getTime() > twoHoursAgo
            );

            if (recentSuccess) {
              console.log(`Last run #${recentSuccess.id} succeeded at ${recentSuccess.updated_at}. No retry needed.`);
              return;
            }

            // Most recent run failed or was cancelled, or no recent success
            const lastRun = runs[0];
            if (lastRun) {
              console.log(`Last run #${lastRun.id}: ${lastRun.conclusion} at ${lastRun.updated_at}.`);
            } else {
              console.log('No previous runs found.');
            }

            // Trigger a retry
            console.log('Triggering a retry publish run...');
            const res = await fetch(`https://api.github.com/repos/${repo}/actions/workflows/publish.yml/dispatches`, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${token}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ ref: 'main', inputs: { dry_run: 'false', slot: 'hourly-retry' } }),
            });

            if (res.status === 204) {
              console.log('Retry triggered successfully.');
            } else {
              const text = await res.text();
              console.error(`Failed to trigger: ${res.status} ${text}`);
              process.exit(1);
            }
          })().catch(e => {
            console.error(e.message);
            process.exit(1);
          });
          NODE